server:
  port: 8080

spring:
  profiles:
    active: dev
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
    #允许一次执行多条SQL语句
    multiple-result-sets-enabled: true


logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  shop:
    address: 双流区锦华路四段与锦华路四段一街交叉口东120米
  baidu:
    ak: i5dS9mru4R7sVyYGUYjcv8GLLv83rvyV
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
  minio:
    endpoint: ${sky.minio.endpoint}
    access-key: ${sky.minio.access-key}
    secret-key: ${sky.minio.secret-key}
    bucket-name: ${sky.minio.bucket-name}
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: itheima
    user-ttl: 7200000
    user-token-name: authentication